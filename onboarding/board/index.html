<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding line</title>
<style>
  :root {
    --bg: #0f1419; --panel: #151c23; --card: #1b242d; --card-hover: #202b36; --line: #27323d;
    --text: #dde5ec; --muted: #8696a6; --faint: #5a6978;
    --run: #4fd1c5; --pass: #6ee7a0; --fail: #f87171; --warn: #fbbf24; --done: #93a5f5;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 20px 6px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .status { font: 12px var(--mono); color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--run); margin-right: 6px; }
  .dot.live { animation: pulse 1.6s ease-in-out infinite; }
  .dot.ok { background: var(--pass); } .dot.down { background: var(--fail); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.live, .chip.now { animation: none; } }

  main { display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 10px; padding: 12px 20px 20px; overflow-x: auto; }
  .col { background: var(--panel); border-radius: 10px; padding: 10px; min-height: 60vh; }
  .col h2 { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .06em; margin: 2px 2px 10px; }
  .col.you h2 { color: var(--fail); } .col.done h2 { color: var(--done); }
  .empty { color: var(--faint); font-size: 12px; padding: 6px 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px; margin-bottom: 9px; cursor: pointer; }
  .card:hover, .card:focus { background: var(--card-hover); outline: none; }
  .card.running { border-color: #2f6f6b; }
  .card.you { border-color: #7a3434; }
  .card.done { opacity: .78; }
  .id { font: 11px var(--mono); color: var(--muted); word-break: break-all; }
  .title { margin: 4px 0 6px; }
  .card.rejected .title { text-decoration: line-through; color: var(--muted); }
  .links, .meta { font: 11px var(--mono); color: var(--muted); }
  a { color: #8fb4ff; text-decoration: none; } a:hover { text-decoration: underline; }
  .round { margin: 6px 0 0; font: 11px var(--mono); color: var(--faint); }
  .chip { display: inline-block; padding: 0 7px; border-radius: 5px; margin-left: 4px; border: 1px dashed var(--faint); color: var(--muted); }
  .chip.pass { background: #173524; color: var(--pass); border: 1px solid transparent; }
  .chip.fail { background: #3d1c1c; color: var(--fail); border: 1px solid transparent; }
  .chip.now { border-color: var(--run); color: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  .note { font-size: 12px; color: var(--warn); margin-top: 6px; }
  .meta { margin-top: 7px; } .risk-medium { color: var(--warn); } .risk-high { color: var(--fail); }

  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(880px, 100%); background: var(--panel); border-left: 1px solid var(--line);
            display: none; grid-template-rows: auto 1fr; }
  #drawer.open { display: grid; }
  #drawer header { border-bottom: 1px solid var(--line); padding: 14px 18px; align-items: center; }
  #drawer button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .steps { display: grid; grid-template-columns: 190px 1fr; min-height: 0; }
  .steps nav { border-right: 1px solid var(--line); padding: 10px; overflow-y: auto; }
  .steps nav div { font: 12px var(--mono); padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .steps nav div:hover { background: var(--card); } .steps nav div.on { background: var(--card); color: var(--text); }
  .doc { padding: 16px 20px; overflow-y: auto; }
  .doc .verdict { display: inline-block; font: 12px var(--mono); padding: 2px 10px; border-radius: 6px; background: var(--card); margin-bottom: 10px; }
  .doc .verdict.pass { background: #173524; color: var(--pass); } .doc .verdict.fail { background: #3d1c1c; color: var(--fail); }
  .doc h3 { font-size: 14px; margin: 16px 0 6px; } .doc p { margin: 4px 0; }
  .doc pre { font: 12px/1.5 var(--mono); background: var(--bg); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
  .doc .quote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .doc .kv { font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 1250px) { main { grid-template-columns: repeat(4, minmax(170px, 1fr)); } .col { min-height: 0; } }
  @media (max-width: 680px) { main { grid-template-columns: 1fr; } .steps { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Onboarding line</h1>
  <div class="status"><span id="live" class="dot ok"></span><span id="summary">connecting</span></div>
</header>
<main id="board"></main>
<aside id="drawer" aria-label="Job steps">
  <header><div><div class="id" id="d-id"></div><div id="d-title"></div></div><button id="d-close">Close</button></header>
  <div class="steps"><nav id="d-steps"></nav><div class="doc" id="d-doc"></div></div>
</aside>

<script>
// The page only reads /api/jobs every two seconds and redraws when something changed.
// Titles and file contents come from GitHub issues, so they are always inserted
// as text (textContent), never as HTML.
const COLUMNS = [
  ["Intake", ["intake"]], ["Spec", ["spec"]], ["Build", ["build", "gate"]], ["Review", ["review"]],
  ["Approve", ["approve", "merging"]], ["Needs you", ["needs-info", "needs-human"]], ["Done", ["merged", "rejected"]],
];
const POLL_MS = 2000;
let jobs = [], lastDrawn = "", openJob = null, openStep = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function minutes(job) {
  const end = job.ended ? new Date(job.ended) : new Date();
  return Math.max(0, Math.round((end - new Date(job.started)) / 60000));
}

function chip(label, result, isNow) {
  const good = result === "PASS", bad = result === "FAIL" || result === "CHANGES";
  return el("span", "chip" + (good ? " pass" : bad ? " fail" : isNow ? " now" : ""), label);
}

function card(job) {
  const waiting = ["needs-info", "needs-human"].includes(job.stage);
  const c = el("div", "card" + (job.running ? " running" : "") + (waiting ? " you" : "") +
                      (job.stage === "merged" ? " done" : "") + (job.stage === "rejected" ? " done rejected" : ""));
  c.tabIndex = 0;
  const id = el("div", "id");
  if (job.running) id.append(el("span", "dot live"));
  id.append(job.id);
  c.append(id, el("div", "title", job.title));

  const links = el("div", "links");
  const issue = el("a", "", "#" + job.issue); issue.href = job.issue_url; issue.target = "_blank";
  links.append(issue);
  if (job.pr) { const pr = el("a", "", "PR #" + job.pr); pr.href = job.pr_url; pr.target = "_blank"; links.append("  ", pr); }
  if (job.stage === "merged") links.append("  merged");
  c.append(links);

  (job.rounds || []).forEach((round, i) => {
    const current = i === job.round - 1;
    const row = el("div", "round", "R" + (i + 1));
    row.append(chip("gate", round.gate, current && ["build", "gate"].includes(job.stage)));
    if (round.gate === "PASS") row.append(chip("review", round.review, current && job.stage === "review"));
    c.append(row);
  });

  if (job.note && (waiting || job.stage === "rejected")) c.append(el("div", "note", job.note));
  const meta = el("div", "meta");
  if (job.risk) meta.append(el("span", "risk-" + job.risk, "risk " + job.risk), ", ");
  meta.append(minutes(job) + " min");
  c.append(meta);

  for (const a of c.querySelectorAll("a")) a.addEventListener("click", e => e.stopPropagation());
  c.addEventListener("click", () => openDrawer(job.id));
  c.addEventListener("keydown", e => { if (e.key === "Enter") openDrawer(job.id); });
  return c;
}

function draw() {
  const board = document.getElementById("board");
  board.replaceChildren();
  for (const [name, stages] of COLUMNS) {
    const mine = jobs.filter(j => stages.includes(j.stage)).sort((a, b) => b.started.localeCompare(a.started));
    const col = el("section", "col" + (name === "Needs you" ? " you" : name === "Done" ? " done" : ""));
    const head = el("h2"); head.append(el("span", "", name), el("span", "", String(mine.length)));
    col.append(head);
    if (!mine.length) col.append(el("div", "empty", "empty"));
    mine.forEach(j => col.append(card(j)));
    board.append(col);
  }
}

async function poll() {
  const live = document.getElementById("live"), summary = document.getElementById("summary");
  try {
    const text = await (await fetch("/api/jobs")).text();
    jobs = JSON.parse(text);
    const running = jobs.filter(j => j.running).length;
    live.className = "dot " + (running ? "live" : "ok");
    summary.textContent = running + " running, " + jobs.length + " jobs, " + new Date().toLocaleTimeString();
    // Redraw on change, and once a minute so "minutes elapsed" keeps moving.
    const stamp = text + Math.floor(Date.now() / 60000);
    if (stamp !== lastDrawn) { lastDrawn = stamp; draw(); if (openJob) fillDrawer(); }
  } catch (e) {
    live.className = "dot down";
    summary.textContent = "board server not reachable";
  }
}

// ---- the drawer: every step of one job, rendered from the files in its folder

function openDrawer(id) { openJob = id; openStep = null; document.getElementById("drawer").classList.add("open"); fillDrawer(); }
function closeDrawer() { openJob = null; document.getElementById("drawer").classList.remove("open"); }
document.getElementById("d-close").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function fillDrawer() {
  const job = jobs.find(j => j.id === openJob);
  if (!job) return closeDrawer();
  document.getElementById("d-id").textContent = job.id + "  ·  " + job.stage + (job.round ? "  ·  round " + job.round : "");
  document.getElementById("d-title").textContent = job.title;
  if (!job.steps.includes(openStep)) openStep = job.steps[job.steps.length - 1] || null;
  const nav = document.getElementById("d-steps");
  nav.replaceChildren();
  for (const step of job.steps) {
    const item = el("div", step === openStep ? "on" : "", step.replace(".md", ""));
    item.addEventListener("click", () => { openStep = step; fillDrawer(); });
    nav.append(item);
  }
  showStep(job.id, openStep);
}

async function showStep(id, step) {
  const doc = document.getElementById("d-doc");
  if (!step) return doc.replaceChildren(el("p", "kv", "No files yet."));
  const response = await fetch("/api/file?job=" + encodeURIComponent(id) + "&name=" + encodeURIComponent(step));
  if (id !== openJob || step !== openStep) return;   // the person clicked elsewhere meanwhile
  doc.replaceChildren(...render(response.ok ? await response.text() : "(file not available)"));
}

// A very small markdown reader: verdict line, KEY: value lines, headings, quotes, the rest as text.
function render(text) {
  const out = [], lines = text.split("\n");
  let block = [];
  const flush = () => { if (block.length) { out.push(el("pre", "", block.join("\n"))); block = []; } };
  lines.forEach((line, i) => {
    if (i === 0 && /^(DECISION|STATUS|VERDICT|GATE|APPROVE|ESCALATE)/.test(line)) {
      const good = /PASS|accepted|READY|APPROVE/.test(line), bad = /FAIL|CHANGES|rejected|BLOCKED|ESCALATE/.test(line);
      out.push(el("div", "verdict" + (good ? " pass" : bad ? " fail" : ""), line));
    } else if (/^#{1,3} /.test(line)) { flush(); out.push(el("h3", "", line.replace(/^#+ /, "")));
    } else if (/^[A-Z]+: /.test(line) && i < 6) { flush(); out.push(el("div", "kv", line));
    } else if (line.startsWith("> ") || line === ">") { flush(); out.push(el("p", "quote", line.slice(2)));
    } else if (line.startsWith("|") || line.startsWith("```") || line.startsWith("  ")) { block.push(line);
    } else { flush(); if (line.trim()) out.push(el("p", "", line)); }
  });
  flush();
  return out;
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
