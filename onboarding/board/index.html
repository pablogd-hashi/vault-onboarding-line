<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding line</title>
<style>
  /* Daylight blue: a cool light page, white cards, one blue for what is running. */
  :root {
    --bg: #f2f5fa; --card: #ffffff; --line: #d3dcea; --text: #13233d; --muted: #5b6a82; --faint: #93a1b8;
    --blue: #1f6feb; --pass: #17703f; --pass-bg: #dff3e6; --fail: #b3302b; --fail-bg: #fbe3e1; --wait: #9a5b00;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: 12px var(--mono); background: var(--card); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { color: var(--text); border-color: var(--faint); }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 24px 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .status { font: 12px var(--mono); color: var(--muted); }
  .lamp, .beat { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .lamp { background: var(--pass); } .lamp.down { background: var(--fail); }
  .lamp.live, .beat { background: var(--blue); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .lamp.live, .beat { animation: none; } }

  main { display: grid; grid-template-columns: repeat(8, minmax(150px, 1fr)); gap: 12px; padding: 0 24px 24px; overflow-x: auto; }
  .lane { min-height: 62vh; }
  /* A lane heading is underlined; the line turns blue when the lane has jobs. */
  .lane h2 { display: flex; justify-content: space-between; margin: 0 0 10px; padding: 0 0 7px; font-size: 13px; font-weight: 600;
             color: var(--muted); border-bottom: 2px solid var(--line); }
  .lane.busy h2 { color: var(--text); border-bottom-color: var(--blue); }
  .lane.you.busy h2 { border-bottom-color: var(--wait); }
  .lane h2 .count { font: 12px var(--mono); color: var(--muted); }
  .empty { color: var(--faint); font-size: 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; cursor: pointer; }
  .card:hover, .card:focus { border-color: var(--blue); outline: none; }
  .card.you { border-color: var(--wait); }
  .id { font: 11px var(--mono); color: var(--muted); word-break: break-all; }
  .title { margin: 3px 0 5px; }
  .card.rejected .title { text-decoration: line-through; color: var(--muted); }
  .links, .meta { font: 11px var(--mono); color: var(--muted); }
  .round { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 6px; font: 11px var(--mono); color: var(--faint); white-space: nowrap; }
  /* A result is a pill: outlined while open, filled green or red once settled. */
  .mark { padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .mark.pass { background: var(--pass-bg); color: var(--pass); border-color: transparent; }
  .mark.fail { background: var(--fail-bg); color: var(--fail); border-color: transparent; }
  .mark.now { border-color: var(--blue); color: var(--blue); }
  .note { font-size: 12px; color: var(--wait); margin-top: 6px; }
  .applied-note { font-size: 12px; color: var(--pass); margin-top: 6px; }
  .meta { margin-top: 7px; display: flex; justify-content: space-between; }
  .risk-medium { color: var(--wait); } .risk-high { color: var(--fail); }

  /* One job's files: a sheet over the board, one tab per step. */
  #shade { position: fixed; inset: 0; background: rgba(19, 35, 61, .35); display: none; }
  #sheet { position: fixed; inset: 5vh 0 auto 0; margin: 0 auto; width: min(900px, calc(100% - 24px)); height: 90vh;
           background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           display: none; grid-template-rows: auto auto 1fr; box-shadow: 0 16px 40px rgba(19, 35, 61, .18); }
  #sheet.open, #shade.open { display: grid; }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 22px 10px; }
  #d-title { font-size: 16px; font-weight: 600; }
  #d-steps { display: flex; gap: 2px; padding: 0 22px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  #d-steps div { font: 12px var(--mono); padding: 7px 10px; cursor: pointer; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  #d-steps div:hover { color: var(--text); } #d-steps div.on { color: var(--blue); border-bottom-color: var(--blue); }
  .doc { padding: 18px 22px; overflow-y: auto; }
  .doc .verdict { display: inline-block; font: 12px var(--mono); padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
  .doc .verdict.pass { background: var(--pass-bg); color: var(--pass); border-color: transparent; }
  .doc .verdict.fail { background: var(--fail-bg); color: var(--fail); border-color: transparent; }
  .doc h3 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; } .doc p { margin: 4px 0; }
  .doc pre { font: 12px/1.5 var(--mono); background: var(--bg); border-radius: 6px; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
  .doc table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 8px 0; }
  .doc th, .doc td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .doc th { color: var(--muted); font-weight: 600; }
  .doc td.pass { color: var(--pass); font-family: var(--mono); } .doc td.fail { color: var(--fail); font-family: var(--mono); }
  .doc .quote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .doc .kv { font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 1250px) { main { grid-template-columns: repeat(4, minmax(165px, 1fr)); row-gap: 22px; } .lane { min-height: 0; } }
  @media (max-width: 680px) { main { grid-template-columns: 1fr; padding: 0 16px 16px; } .top { padding: 16px; flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<header class="top">
  <h1>Onboarding line</h1>
  <div class="status"><span id="live" class="lamp"></span><span id="summary">connecting</span></div>
</header>
<main id="board"></main>
<div id="shade"></div>
<aside id="sheet" aria-label="Job steps">
  <div class="sheet-head"><div><div class="id" id="d-id"></div><div id="d-title"></div></div><button id="d-close">Close</button></div>
  <nav id="d-steps"></nav>
  <div class="doc" id="d-doc"></div>
</aside>

<script>
// The page only reads /api/jobs every two seconds and redraws when something changed.
// Titles and file contents come from GitHub issues, so they are always inserted
// as text (textContent), never as HTML.
const COLUMNS = [
  ["Intake", ["intake"]], ["Spec", ["spec"]], ["Build", ["build", "gate"]], ["Review", ["review"]],
  ["Approve", ["approve", "merging"]], ["Needs you", ["needs-info", "needs-human"]],
  ["Ready to apply", ["ready-to-apply", "merged"]], ["Done", ["applied", "rejected"]],
];
const POLL_MS = 2000;
let jobs = [], lastDrawn = "", openJob = null, openStep = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function minutes(job) {
  const end = job.ended ? new Date(job.ended) : new Date();
  return Math.max(0, Math.round((end - new Date(job.started)) / 60000));
}

function mark(label, result, isNow) {
  const good = result === "PASS", bad = result === "FAIL" || result === "CHANGES";
  return el("span", "mark" + (good ? " pass" : bad ? " fail" : isNow ? " now" : ""), label);
}

function card(job) {
  const waiting = ["needs-info", "needs-human", "ready-to-apply", "merged"].includes(job.stage);
  const c = el("div", "card" + (job.running ? " running" : "") + (waiting ? " you" : "") +
                      (job.stage === "applied" ? " applied" : "") + (job.stage === "rejected" ? " rejected" : ""));
  c.tabIndex = 0;
  const id = el("div", "id");
  if (job.running) id.append(el("span", "beat"));
  id.append(job.id);
  c.append(id, el("div", "title", job.title));

  const links = el("div", "links");
  const issue = el("a", "", "issue " + job.issue); issue.href = job.issue_url; issue.target = "_blank";
  links.append(issue);
  if (job.pr) { const pr = el("a", "", "pull " + job.pr); pr.href = job.pr_url; pr.target = "_blank"; links.append(" · ", pr); }
  if (["ready-to-apply", "merged", "applied"].includes(job.stage)) links.append(" · merged");
  c.append(links);

  (job.rounds || []).forEach((round, i) => {
    const current = i === job.round - 1;
    const row = el("div", "round", "round " + (i + 1));
    row.append(mark("gate", round.gate, current && ["build", "gate"].includes(job.stage)));
    if (round.gate === "PASS") row.append(mark("review", round.review, current && job.stage === "review"));
    c.append(row);
  });

  if (["ready-to-apply", "merged"].includes(job.stage)) c.append(el("div", "note", "run onboarding/bin/apply " + job.issue));
  else if (job.note && (waiting || job.stage === "rejected")) c.append(el("div", "note", job.note));
  if (job.stage === "applied") c.append(el("div", "applied-note", "applied to Vault"));
  const meta = el("div", "meta");
  meta.append(job.risk ? el("span", "risk-" + job.risk, "risk " + job.risk) : el("span"), el("span", "", minutes(job) + " min"));
  c.append(meta);

  for (const a of c.querySelectorAll("a")) a.addEventListener("click", e => e.stopPropagation());
  c.addEventListener("click", () => openSheet(job.id));
  c.addEventListener("keydown", e => { if (e.key === "Enter") openSheet(job.id); });
  return c;
}

function draw() {
  const board = document.getElementById("board");
  board.replaceChildren();
  COLUMNS.forEach(([name, stages]) => {
    const mine = jobs.filter(j => stages.includes(j.stage)).sort((a, b) => b.started.localeCompare(a.started));
    const lane = el("section", "lane" + (["Needs you", "Ready to apply"].includes(name) ? " you" : "") + (mine.length ? " busy" : ""));
    const head = el("h2");
    head.append(el("span", "", name), el("span", "count", String(mine.length)));
    lane.append(head);
    if (!mine.length) lane.append(el("div", "empty", "empty"));
    mine.forEach(j => lane.append(card(j)));
    board.append(lane);
  });
}

async function poll() {
  const live = document.getElementById("live"), summary = document.getElementById("summary");
  try {
    const text = await (await fetch("/api/jobs")).text();
    jobs = JSON.parse(text);
    const running = jobs.filter(j => j.running).length;
    live.className = "lamp" + (running ? " live" : "");
    summary.textContent = running + " running · " + jobs.length + " jobs · " + new Date().toLocaleTimeString();
    // Redraw on change, and once a minute so "minutes elapsed" keeps moving.
    const stamp = text + Math.floor(Date.now() / 60000);
    if (stamp !== lastDrawn) { lastDrawn = stamp; draw(); if (openJob) fillSheet(); }
  } catch (e) {
    live.className = "lamp down";
    summary.textContent = "board server not reachable";
  }
}

// ---- the sheet: every step of one job, rendered from the files in its folder

function openSheet(id, step) {
  openJob = id; openStep = step || null;
  for (const part of ["sheet", "shade"]) document.getElementById(part).classList.add("open");
  fillSheet();
}
function closeSheet() {
  openJob = null;
  for (const part of ["sheet", "shade"]) document.getElementById(part).classList.remove("open");
}
document.getElementById("d-close").addEventListener("click", closeSheet);
document.getElementById("shade").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function fillSheet() {
  const job = jobs.find(j => j.id === openJob);
  if (!job) return closeSheet();
  document.getElementById("d-id").textContent = job.id + "  ·  " + job.stage + (job.round ? "  ·  round " + job.round : "");
  document.getElementById("d-title").textContent = job.title;
  if (!job.steps.includes(openStep)) openStep = job.steps[job.steps.length - 1] || null;
  const nav = document.getElementById("d-steps");
  nav.replaceChildren();
  for (const step of job.steps) {
    const item = el("div", step === openStep ? "on" : "", step.replace(".md", "").replace("round-", "round ").replace(/\//g, " · "));
    item.addEventListener("click", () => { openStep = step; fillSheet(); });
    nav.append(item);
  }
  showStep(job.id, openStep);
}

async function showStep(id, step) {
  const doc = document.getElementById("d-doc");
  if (!step) return doc.replaceChildren(el("p", "kv", "No files yet."));
  const response = await fetch("/api/file?job=" + encodeURIComponent(id) + "&name=" + encodeURIComponent(step));
  if (id !== openJob || step !== openStep) return;   // the person clicked elsewhere meanwhile
  doc.replaceChildren(...render(response.ok ? await response.text() : "(file not available)"));
}

// A very small markdown reader: verdict line, KEY: value lines, headings, quotes, the rest as text.
function render(text) {
  const out = [], lines = text.split("\n");
  let block = [];
  const flush = () => {
    if (!block.length) return;
    out.push(block[0].startsWith("|") ? table(block) : el("pre", "", block.join("\n")));
    block = [];
  };
  // A markdown table becomes a real table; PASS and FAIL cells get their colour.
  const table = rows => {
    const t = el("table");
    rows.filter(r => !/^\|[-| ]+\|$/.test(r)).forEach((row, n) => {
      const tr = el("tr");
      row.replace(/^\||\|$/g, "").split("|").forEach(cell => {
        const text = cell.trim().replace(/\*\*/g, "").replace(/`/g, "");
        tr.append(el(n ? "td" : "th", text === "PASS" ? "pass" : text === "FAIL" ? "fail" : "", text));
      });
      t.append(tr);
    });
    return t;
  };
  lines.forEach((line, i) => {
    if (i === 0 && /^(DECISION|STATUS|VERDICT|GATE|APPROVE|ESCALATE|APPLY)/.test(line)) {
      const good = /PASS|accepted|READY|APPROVE/.test(line), bad = /FAIL|CHANGES|rejected|BLOCKED|ESCALATE/.test(line);
      out.push(el("div", "verdict" + (good ? " pass" : bad ? " fail" : ""), line));
    } else if (/^#{1,3} /.test(line)) { flush(); out.push(el("h3", "", line.replace(/^#+ /, "")));
    } else if (/^[A-Z]+: /.test(line) && i < 6) { flush(); out.push(el("div", "kv", line));
    } else if (line.startsWith("> ") || line === ">") { flush(); out.push(el("p", "quote", line.slice(2)));
    } else if (line.startsWith("|") || line.startsWith("```") || line.startsWith("  ")) { block.push(line);
    } else { flush(); if (line.trim()) out.push(el("p", "", line)); }
  });
  flush();
  return out;
}

// A link can open one step of one job, for example /#GH-1-auth-api/intake.md
poll().then(() => {
  const [id, ...step] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (jobs.some(j => j.id === id)) openSheet(id, step.join("/"));
});
setInterval(poll, POLL_MS);
</script>
</body>
</html>
